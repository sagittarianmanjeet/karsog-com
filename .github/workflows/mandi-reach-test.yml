# Temporary: checks whether GitHub's servers can reach api.data.gov.in. Delete after the test.
name: mandi reach test
on:
  push:
    branches: [mandi-via-actions]
    paths: ['.github/workflows/mandi-reach-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try data.gov.in
        run: |
          U='https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&limit=2&filters%5Bstate.keyword%5D=Himachal%20Pradesh'
          for UA in "Mozilla/5.0 (compatible; karsog.com mandi rates; +https://karsog.com/mandi-rates/)" "none"; do
            if [ "$UA" = none ]; then H=(); else H=(-A "$UA"); fi
            R=$(curl -sS -m 40 "${H[@]}" -o body.txt -w "%{http_code} %{time_total}s" "$U" 2>&1) || true
            echo "::notice title=UA=$UA::result=$R ip=$(curl -s -m 10 https://api.ipify.org) body=$(head -c 160 body.txt 2>/dev/null | tr -d '\n\"')"
          done
