# Temporary: checks whether GitHub's servers can reach data.gov.in. Delete after the test.
name: mandi reach test
on:
  push:
    branches: [mandi-via-actions]
    paths: ['.github/workflows/mandi-reach-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try data.gov.in addresses
        run: |
          Q='9ef84268-d588-465a-a308-a864a43d0070?api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b&format=json&limit=2&filters%5Bstate.keyword%5D=Himachal%20Pradesh'
          for U in "https://www.data.gov.in/backend/dataapi/v1/resource/$Q" "https://data.gov.in/backend/dataapi/v1/resource/$Q" "https://api.data.gov.in/resource/$Q"; do
            R=$(curl -sS -m 40 -A "Mozilla/5.0 (compatible; karsog.com mandi rates; +https://karsog.com/mandi-rates/)" -o body.txt -w "%{http_code}" "$U" 2>&1) || true
            echo "::notice title=${U:8:40}::result=$R body=$(head -c 140 body.txt 2>/dev/null | tr -d '\n\"')"
          done
          echo "::notice title=dns::$(getent hosts www.data.gov.in api.data.gov.in | tr '\n' ' ')"
